<!DOCTYPE html>

<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>168台股投資教室｜投資小百科</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root { --orange:#D96820; --orange2:#E88A40; --yellow:#E8B830; --bg:#FEFCF0; --text1:#2A1A08; --text2:#5A3A18; --text3:#9A7048; --line:#E8D8B8; --sc:#D96820; }
body { background:#C8AD80; font-family:'Noto Sans TC',sans-serif; min-height:100vh; display:flex; justify-content:center; align-items:flex-start; padding:24px 0 48px; }
.frame { width:390px; background-color:#FEFCF0; background-image:repeating-linear-gradient(to bottom,transparent 0px,transparent 29px,rgba(140,170,210,0.18) 29px,rgba(140,170,210,0.18) 30px); border-radius:16px; overflow:hidden; display:flex; flex-direction:column; box-shadow:0 2px 0 #B89850,0 4px 0 rgba(160,120,40,0.3),0 8px 32px rgba(80,50,10,0.22),inset 0 0 0 1px rgba(200,170,110,0.4); }
.loading { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:400px; gap:16px; width:390px; background:#FEFCF0; border-radius:16px; }
.loading-spinner { width:36px; height:36px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--orange); animation:spin 0.8s linear infinite; }
@keyframes spin { to{transform:rotate(360deg);} }
.loading p { font-size:13px; letter-spacing:1px; color:var(--text3); }
.hero { width:100%; height:200px; position:relative; overflow:hidden; flex-shrink:0; cursor:pointer; }
.hero-default { width:100%; height:100%; background:linear-gradient(145deg,#FFB347 0%,#FFCA6A 40%,#FF8C42 100%); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; position:relative; overflow:hidden; }
.hero-default::before { content:''; position:absolute; width:260px; height:260px; border-radius:50%; background:rgba(255,255,255,0.12); top:-80px; right:-60px; }
.sun-icon { font-size:48px; animation:pulse 3s ease-in-out infinite; position:relative; z-index:1; }
@keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.06);} }
.hero-hint { font-size:11px; letter-spacing:2px; color:rgba(255,255,255,0.75); position:relative; z-index:1; }
.hero img.bg { width:100%; height:100%; object-fit:cover; display:block; }
.hero::after { content:''; position:absolute; bottom:0; left:0; right:0; height:28px; background:linear-gradient(to top,rgba(255,251,247,0.85),transparent); pointer-events:none; z-index:2; }
.hero-brand { position:absolute; bottom:8px; left:0; right:0; display:flex; justify-content:center; z-index:3; pointer-events:none; }
.hero-brand-txt { font-size:10px; font-weight:700; letter-spacing:1.5px; color:rgba(80,40,10,0.7); background:rgba(255,255,255,0.45); padding:3px 12px; border-radius:20px; }
.id-pill { position:absolute; top:14px; right:14px; z-index:5; color:white; font-size:10px; font-weight:700; letter-spacing:1px; padding:5px 12px; border-radius:6px; background:var(--sc); box-shadow:2px 2px 0 rgba(0,0,0,0.2); font-family:'Noto Serif TC',serif; transition:background 0.3s; }
.upload-btn { position:absolute; bottom:10px; right:14px; background:rgba(255,255,255,0.82); border:1px solid rgba(200,165,100,0.35); color:var(--text2); font-size:10px; font-weight:700; letter-spacing:1px; padding:4px 11px; border-radius:6px; cursor:pointer; z-index:10; }
.edit-btn { display:none; position:absolute; bottom:10px; right:10px; width:28px; height:28px; border-radius:50%; background:rgba(255,255,255,0.55); font-size:14px; line-height:28px; text-align:center; cursor:pointer; z-index:10; opacity:0; transition:opacity 0.25s; }
.hero:hover .edit-btn { opacity:1; }
input[type=file]{display:none;}
.series-bar { display:flex; border-bottom:2px solid var(--line); background:rgba(254,252,240,0.95); flex-shrink:0; }
.series-tab { flex:1; padding:10px 4px 8px; display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; border-bottom:3px solid transparent; transition:all 0.25s; position:relative; top:2px; }
.series-tab:hover { background:rgba(0,0,0,0.03); }
.series-tab.on { border-bottom-color:var(--tab-c,#888); }
.s-icon { font-size:18px; line-height:1; }
.s-code { font-size:8.5px; font-weight:800; letter-spacing:1px; color:var(--tab-c,#888); opacity:0.55; }
.series-tab.on .s-code { opacity:1; }
.s-name { font-size:9px; font-weight:600; color:var(--text3); white-space:nowrap; }
.series-tab.on .s-name { color:var(--text1); font-weight:700; }
.content { flex:1; padding:8px 18px 14px; background:transparent; transition:opacity 0.2s; }
.term-header { padding-bottom:10px; border-bottom:1.5px dashed rgba(180,140,60,0.3); margin-bottom:11px; }
.meta-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
.lbl { font-size:10px; font-weight:700; color:var(--sc); letter-spacing:2px; display:flex; align-items:center; gap:5px; }
.lbl::before { content:''; width:7px; height:7px; background:var(--sc); border-radius:50%; display:inline-block; }
.wk { font-size:9px; color:var(--text3); letter-spacing:0.5px; text-align:right; max-width:58%; line-height:1.4; }
.term-zh { font-family:'Noto Serif TC',serif; font-size:34px; font-weight:900; color:var(--text1); letter-spacing:3px; line-height:1.15; }
.term-zh .hl { color:var(--sc); }
.term-en { font-size:13px; color:var(--text3); margin-top:3px; letter-spacing:1.5px; font-weight:800; }
.grid2x2 { display:grid; grid-template-columns:1fr 1fr; grid-auto-rows:1fr; gap:9px; margin-bottom:10px; align-items:stretch; }
.grid-cell { border-radius:9px; padding:11px 12px 10px; position:relative; overflow:hidden; display:flex; flex-direction:column; transition:transform 0.2s; }
.grid-cell:hover { transform:translateY(-1px); }
.cell-deco { position:absolute; bottom:-6px; right:-3px; font-size:48px; opacity:0.12; line-height:1; pointer-events:none; user-select:none; filter:saturate(0.6); }
.cell-label { font-size:13px; font-weight:800; letter-spacing:0.3px; margin-bottom:8px; display:flex; align-items:center; gap:5px; }
.cell-label .icon { font-size:16px; }
.cell-body { font-size:15px; line-height:1.6; font-weight:500; position:relative; z-index:1; flex:1; }
.cell-body b { font-weight:800; }
.num { display:inline-block; font-size:14px; font-weight:700; padding:1px 7px; border-radius:5px; font-family:'Noto Serif TC',serif; }
.cell-a { background:#FDF2E4; border:1.5px solid rgba(180,100,30,0.22); box-shadow:2px 2px 0 rgba(160,90,20,0.08); }
.cell-a .cell-label{color:#B84A10;} .cell-a .cell-body{color:#5A2C08;} .cell-a .cell-body b{color:#A03A08;} .cell-a .num{background:rgba(180,80,20,0.12);color:#903010;}
.cell-b { background:#EDF8F2; border:1.5px solid rgba(60,140,100,0.22); box-shadow:2px 2px 0 rgba(40,120,80,0.08); }
.cell-b .cell-label{color:#1A7A50;} .cell-b .cell-body{color:#0E4A30;} .cell-b .cell-body b{color:#106040;} .cell-b .num{background:rgba(40,130,80,0.12);color:#106040;}
.cell-c { background:#EDF3FA; border:1.5px solid rgba(70,120,180,0.22); box-shadow:2px 2px 0 rgba(50,90,150,0.08); }
.cell-c .cell-label{color:#2050A0;} .cell-c .cell-body{color:#102848;} .cell-c .cell-body b{color:#183880;} .cell-c .num{background:rgba(50,100,180,0.12);color:#183880;}
.cell-d { background:#FEFBE6; border:1.5px solid rgba(180,150,0,0.25); box-shadow:2px 2px 0 rgba(160,130,0,0.08); }
.cell-d .cell-label{color:#806000;font-weight:900;} .cell-d .cell-body{color:#4A3000;} .cell-d .cell-body b{color:#6A4800;} .cell-d .num{background:rgba(160,130,0,0.14);color:#6A4800;} .cell-d .cell-label .icon{font-size:18px;}
.key-card { background:rgba(255,244,232,0.95); border-radius:9px; padding:10px 14px; margin-bottom:10px; border:1.5px solid rgba(200,120,40,0.2); box-shadow:2px 2px 0 rgba(180,100,20,0.1); position:relative; overflow:hidden; display:flex; align-items:center; gap:10px; }
.key-card::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:linear-gradient(to right,var(--sc),var(--yellow)); border-radius:9px 9px 0 0; }
.key-label { font-size:9px; font-weight:700; color:var(--sc); letter-spacing:2px; white-space:nowrap; display:flex; align-items:center; gap:3px; flex-shrink:0; }
.key-label::before { content:'★'; font-size:8px; }
.key-text { font-family:'Noto Serif TC',serif; font-size:14px; color:var(--text1); line-height:1.55; font-weight:700; letter-spacing:0.5px; flex:1; }
.diff-badge { flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:2px; padding:5px 9px; border-radius:8px; font-size:18px; line-height:1; }
.diff-badge .diff-txt { font-size:8px; font-weight:800; letter-spacing:1.5px; }
.diff-easy{background:rgba(80,180,100,0.12);border:1.5px solid rgba(60,160,80,0.22);} .diff-easy .diff-txt{color:#2A8040;}
.diff-mid{background:rgba(255,160,30,0.12);border:1.5px solid rgba(220,130,20,0.25);} .diff-mid .diff-txt{color:#A06010;}
.diff-hard{background:rgba(180,50,50,0.10);border:1.5px solid rgba(160,40,40,0.22);} .diff-hard .diff-txt{color:#902020;}
.subtitle-bar { margin:0 0 10px; border-radius:9px; background:rgba(38,24,8,0.88); padding:10px 14px; min-height:64px; display:flex; align-items:center; gap:10px; box-shadow:2px 2px 0 rgba(80,50,10,0.12); }

/* 麥克風＋音波容器 */
.sub-mic-wrap { flex-shrink:0; display:flex; align-items:center; gap:4px; }
.sub-icon { font-size:18px; flex-shrink:0; transition:transform 0.1s; }
.sub-icon.speaking { animation:micBounce 0.4s ease-in-out infinite alternate; }
@keyframes micBounce { 0%{transform:scale(1);} 100%{transform:scale(1.25);} }

/* 音波條 */
.wave-bars { display:flex; align-items:center; gap:2px; height:20px; }
.wave-bar { width:3px; border-radius:3px; background:#FFB347; opacity:0.25; transform:scaleY(0.3); transform-origin:bottom; transition:transform 0.1s; }
.wave-bars.active .wave-bar:nth-child(1) { animation:waveAnim 0.6s ease-in-out infinite; }
.wave-bars.active .wave-bar:nth-child(2) { animation:waveAnim 0.6s ease-in-out 0.1s infinite; }
.wave-bars.active .wave-bar:nth-child(3) { animation:waveAnim 0.6s ease-in-out 0.2s infinite; }
.wave-bars.active .wave-bar:nth-child(4) { animation:waveAnim 0.6s ease-in-out 0.05s infinite; }
.wave-bars.active .wave-bar:nth-child(5) { animation:waveAnim 0.6s ease-in-out 0.15s infinite; }
@keyframes waveAnim {
0%,100% { transform:scaleY(0.3); opacity:0.3; }
50%      { transform:scaleY(1);   opacity:0.9; }
}

/* 字幕文字區 */
.sub-text { font-size:13.5px; line-height:1.75; font-weight:500; letter-spacing:0.5px; flex:1; }
.sub-char { color:rgba(245,232,200,0.4); transition:color 0.15s; display:inline; }
.sub-char.lit { color:#F5E8C8; }
.sub-char.cur { color:#FFB347; }

.sub-cursor { display:inline-block; width:2px; height:13px; background:#FFB347; border-radius:1px; vertical-align:middle; animation:blink 1s step-end infinite; margin-left:2px; }
@keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0;} }

.sub-btns { display:flex; flex-direction:column; align-items:flex-end; gap:5px; flex-shrink:0; }
.sub-play-btn { font-size:9px; color:rgba(255,183,71,0.6); letter-spacing:1px; font-weight:700; cursor:pointer; user-select:none; padding:3px 7px; border-radius:4px; border:1px solid rgba(255,183,71,0.22); white-space:nowrap; }
.sub-play-btn:hover { color:#FFB347; border-color:rgba(255,183,71,0.5); }
.sub-speak-btn { font-size:15px; cursor:pointer; user-select:none; padding:2px 6px; border-radius:4px; border:1px solid rgba(255,183,71,0.22); opacity:0.55; transition:all 0.2s; line-height:1.4; }
.sub-speak-btn:hover { opacity:1; border-color:rgba(255,183,71,0.5); }
.sub-speak-btn.speaking { opacity:1; }
.sub-speak-btn.cached { border-color:rgba(100,220,120,0.5); }
.sub-dl-btn { font-size:15px; cursor:pointer; user-select:none; padding:2px 6px; border-radius:4px; border:1px solid rgba(100,220,120,0.4); opacity:0.7; transition:all 0.2s; line-height:1.4; }
.sub-dl-btn:hover { opacity:1; border-color:rgba(100,220,120,0.8); }
/* 快取標示：🔊右上角小綠點 */
.sub-mic-wrap { position:relative; }
.cache-dot { display:none; position:absolute; top:-2px; right:-2px; width:8px; height:8px; background:#4CAF50; border-radius:50%; border:1.5px solid rgba(38,24,8,0.88); }
.footer{padding-top:9px;border-top:1.5px dashed rgba(180,140,60,0.28);display:flex;flex-direction:column;align-items:center;gap:4px;}
.slogan{font-family:‘Noto Serif TC’,serif;font-size:13px;font-weight:700;color:var(–orange);letter-spacing:3px;display:flex;align-items:center;gap:8px;}
.slogan::before,.slogan::after{content:’’;display:inline-block;width:18px;height:1px;background:var(–orange2);}
.brand-txt{font-size:10.5px;color:var(–text3);letter-spacing:1.5px;}
.nav{padding:8px 16px 18px;background:rgba(254,252,240,0.9);display:flex;flex-direction:column;gap:7px;border-top:1px solid rgba(140,170,210,0.18);}

/* 小系列快捷列 */
.subseries-wrap{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;display:flex;gap:6px;padding-bottom:2px;}
.subseries-wrap::-webkit-scrollbar{display:none;}
.ss-btn{flex-shrink:0;padding:5px 11px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:0.5px;cursor:pointer;white-space:nowrap;border:1.5px solid rgba(200,165,100,0.3);background:rgba(255,255,255,0.5);color:var(–text3);transition:all 0.2s;}
.ss-btn:hover{border-color:var(–sc);color:var(–sc);}
.ss-btn.on{background:var(–sc);color:white;border-color:var(–sc);}

.dots{display:flex;justify-content:center;gap:5px;flex-wrap:wrap;}
.dot{width:5px;height:5px;border-radius:50%;background:rgba(180,100,30,0.18);cursor:pointer;transition:all 0.3s;}
.dot.on{background:var(–sc);width:18px;border-radius:3px;}
.pages-wrap{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;display:flex;gap:7px;padding-bottom:2px;}
.pages-wrap::-webkit-scrollbar{display:none;}
.page-btn{flex-shrink:0;min-width:82px;background:rgba(255,255,255,0.55);border:1.5px solid rgba(200,165,100,0.28);border-radius:8px;padding:7px 9px;cursor:pointer;text-align:center;transition:all 0.2s;}
.page-btn:hover{border-color:var(–sc);transform:translateY(-1px);}
.page-btn.on{border-color:var(–sc);background:rgba(253,240,228,0.92);}
.page-btn-id{font-size:9px;font-weight:700;color:var(–sc);letter-spacing:0.8px;display:block;margin-bottom:2px;}
.page-btn-zh{font-size:11px;color:var(–text1);font-weight:600;display:block;white-space:nowrap;}
@media(max-width:430px){body{padding:0;background:var(–bg);}.frame{width:100vw;border-radius:0;box-shadow:none;}}
</style>

</head>
<body>

<div class="loading" id="loading">
  <div class="loading-spinner"></div>

</div>

<div class="frame" id="app" style="display:none">
  <div class="hero" id="hero" onclick="document.getElementById('imgFile').click()">

<script>
/* ══ 唯一需要修改的設定 ══ */
const CSV_URL = 'https://raw.githubusercontent.com/YOUR_USERNAME/YOUR_REPO/main/168%E6%8A%95%E8%B3%87%E5%B0%8F%E7%99%BE%E7%A7%91.csv';

/* ══ 系列外觀設定 ══ */
const SERIES_META = {
  STOCK: { color:'#2D7D46', icon:'📈', name:'股市基礎' },
  CB:    { color:'#D96820', icon:'🔄', name:'可轉債'   },
  PSY:   { color:'#7B3FA0', icon:'🧠', name:'投資心理' },
  REX:   { color:'#C0392B', icon:'👴', name:'實戰心法' }
};

let DB = {}, curSeries = '', curPage = 0;
let subTimer=null, subPlaying=false, subIdx=0, subFull='';

/* ── CSV解析 ── */
function parseCSV(text) {
  const lines = text.trim().split('\n');
  const headers = lines[0].split(',').map(h=>h.trim().replace(/^"|"$/g,''));
  return lines.slice(1).filter(l=>l.trim()).map(line=>{
    const cols=[]; let inQ=false, cur='';
    for(const ch of line){
      if(ch==='"'){inQ=!inQ;}
      else if(ch===','&&!inQ){cols.push(cur.trim().replace(/^"|"$/g,''));cur='';}
      else{cur+=ch;}
    }
    cols.push(cur.trim().replace(/^"|"$/g,''));
    const obj={};
    headers.forEach((h,i)=>obj[h]=cols[i]||'');
    return obj;
  });
}

/* ══════════════════════════════════════
   設定：GitHub CSV連結
   把YOUR_USERNAME和YOUR_REPO換成您的帳號和repo名稱
   ══════════════════════════════════════ */
const CSV_URL = 'https://raw.githubusercontent.com/rexdashu168/englishplay/main/168.csv';

/* ── CSV解析 ── */
function parseCSV(text){
  const lines=text.trim().split('\n');
  const headers=lines[0].split(',').map(h=>h.trim().replace(/^"|"$/g,''));
  return lines.slice(1).filter(l=>l.trim()).map(line=>{
    const cols=[]; let inQ=false, cur='';
    for(const ch of line){
      if(ch==='"'){inQ=!inQ;}
      else if(ch===','&&!inQ){cols.push(cur.trim().replace(/^"|"$/g,''));cur='';}
      else{cur+=ch;}
    }
    cols.push(cur.trim().replace(/^"|"$/g,''));
    const obj={};
    headers.forEach((h,i)=>obj[h]=cols[i]||'');
    // subseries從wk欄位自動提取（格式：大標題・系列名稱）
    if(!obj.subseries){
      const wk=obj.wk||'';
      const idx=wk.indexOf('・');
      obj.subseries=idx>=0?wk.substring(idx+1):wk;
    }
    return obj;
  });
}

/* ── 載入資料 ── */
async function loadData(){
  try{
    const res=await fetch(CSV_URL);
    if(!res.ok) throw new Error('無法讀取CSV：'+res.status);
    const rows=parseCSV(await res.text());
    DB={};
    rows.forEach(r=>{
      if(!DB[r.series])DB[r.series]=[];
      DB[r.series].push(r);
    });
    init();
  }catch(e){
    document.getElementById('loading').innerHTML=
      `<div style="color:#C0392B;font-size:13px;padding:32px;text-align:center;width:390px">
        ⚠️ 資料載入失敗<br>
        <small style="color:#999;margin-top:8px;display:block">
          請確認 GitHub CSV 連結是否正確<br>${e.message}
        </small>
      </div>`;
  }
}

/* ── 初始化 ── */
function init(){
  document.getElementById('loading').style.display='none';
  document.getElementById('app').style.display='flex';
  buildSeriesBar();
  switchSeries(Object.keys(DB)[0]);
}

/* ── 建立系列列 ── */
function buildSeriesBar(){
  const bar=document.getElementById('seriesBar');
  bar.innerHTML='';
  Object.keys(DB).forEach(s=>{
    const m=SERIES_META[s]||{color:'#888',icon:'📋',name:s};
    const el=document.createElement('div');
    el.className='series-tab'; el.id='tab-'+s;
    el.style.setProperty('--tab-c',m.color);
    el.innerHTML=`<span class="s-icon">${m.icon}</span><span class="s-code">${s}</span><span class="s-name">${m.name}</span>`;
    el.onclick=()=>switchSeries(s);
    bar.appendChild(el);
  });
}

/* ── 切換系列 ── */
function switchSeries(s){
  curSeries=s; curPage=0;
  const m=SERIES_META[s]||{color:'#888'};
  document.querySelectorAll('.series-tab').forEach(el=>el.classList.remove('on'));
  const tab=document.getElementById('tab-'+s);
  if(tab)tab.classList.add('on');
  document.documentElement.style.setProperty('--sc',m.color);
  buildPageNav(); renderPage(0);
}

/* ── 建立頁面導航（含小系列快捷列） ── */
function buildPageNav(){
  const pages=DB[curSeries]||[];
  const dotsEl=document.getElementById('dots');
  const pagesEl=document.getElementById('pages');
  const ssWrap=document.getElementById('subseriesWrap');
  dotsEl.innerHTML=''; pagesEl.innerHTML=''; ssWrap.innerHTML='';

  // 收集小系列（依出現順序去重）
  const ssOrder=[], ssSeen={};
  pages.forEach(p=>{
    const ss=p.subseries||'';
    if(ss && !ssSeen[ss]){ ssOrder.push(ss); ssSeen[ss]=true; }
  });

  // 建立小系列快捷按鈕
  ssOrder.forEach((ss,si)=>{
    const firstIdx=pages.findIndex(p=>p.subseries===ss);
    const btn=document.createElement('div');
    btn.className='ss-btn'+(si===0?' on':'');
    btn.id='ss-'+si;
    btn.textContent=ss;
    btn.onclick=()=>{
      // 只捲動頁面按鈕到該小系列起點，不切換當前頁面
      document.querySelectorAll('.ss-btn').forEach(el=>el.classList.remove('on'));
      btn.classList.add('on');
      const targetBtn=document.querySelectorAll('.page-btn')[firstIdx];
      if(targetBtn) targetBtn.scrollIntoView({behavior:'smooth',block:'nearest',inline:'start'});
    };
    ssWrap.appendChild(btn);
  });

  // 建立點點和頁面按鈕
  pages.forEach((p,i)=>{
    const dot=document.createElement('div');
    dot.className='dot'+(i===0?' on':'');
    dot.onclick=()=>goPage(i);
    dotsEl.appendChild(dot);

    const btn=document.createElement('div');
    btn.className='page-btn'+(i===0?' on':'');
    btn.innerHTML=`<span class="page-btn-id">${p.id}</span><span class="page-btn-zh">${p.zh}</span>`;
    btn.onclick=()=>goPage(i);
    pagesEl.appendChild(btn);
  });
}

/* ── 切換頁面 ── */
function goPage(i){
  curPage=i;
  const c=document.getElementById('content');
  c.style.opacity='0';
  clearInterval(subTimer); subPlaying=false;
  setTimeout(()=>{renderPage(i);c.style.opacity='1';},200);
  document.querySelectorAll('.dot').forEach((el,j)=>el.classList.toggle('on',j===i));
  document.querySelectorAll('.page-btn').forEach((el,j)=>el.classList.toggle('on',j===i));
  const btns=document.querySelectorAll('.page-btn');
  if(btns[i])btns[i].scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});

  // 同步更新小系列高亮：找當前頁屬於哪個小系列
  const pages=DB[curSeries]||[];
  const curSS=pages[i]?.subseries||'';
  const ssOrder=[], ssSeen={};
  pages.forEach(p=>{const ss=p.subseries||'';if(ss&&!ssSeen[ss]){ssOrder.push(ss);ssSeen[ss]=true;}});
  const ssIdx=ssOrder.indexOf(curSS);
  document.querySelectorAll('.ss-btn').forEach((el,j)=>el.classList.toggle('on',j===ssIdx));
}

/* ── 渲染頁面 ── */
function renderPage(i){
  const p=DB[curSeries][i]; if(!p)return;
  const m=SERIES_META[curSeries]||{color:'#888'};

  // 更新當前頁面id（供朗讀快取和下載用）
  curAudioId = p.id;

  document.getElementById('idPill').textContent=p.id;
  document.getElementById('idPill').style.background=m.color;
  document.getElementById('wk').textContent=p.wk;
  const zh=p.zh, hl=p.zh_hl;
  document.getElementById('zh').innerHTML=(hl&&zh.includes(hl))?zh.replace(hl,`<span class="hl">${hl}</span>`):zh;
  document.getElementById('en').textContent=p.en;
  document.getElementById('deco1').textContent=p.d1;
  document.getElementById('deco2').textContent=p.d2;
  document.getElementById('deco3').textContent=p.d3;
  document.getElementById('deco4').textContent=p.d4;
  document.getElementById('g1').innerHTML=p.g1;
  document.getElementById('g2').innerHTML=p.g2;
  document.getElementById('g3').innerHTML=buildG3(p);
  document.getElementById('g4').innerHTML=p.g4;
  document.getElementById('key').textContent=p.key;
  const badge=document.getElementById('diffBadge');
  badge.className='diff-badge diff-'+p.diff;
  document.getElementById('diffIcon').textContent=p.diff_icon;
  document.getElementById('diffTxt').textContent=p.diff_txt;
  showSub(p.sub);
}

/* ── 組合g3 ── */
function buildG3(p){
  let html='';
  if(p.g3a){
    let line=p.g3a;
    if(p.g3a_num1)line+=` <span class="num">${p.g3a_num1}</span>`;
    if(p.g3a_num2)line+=` ${p.g3a_num2}`;
    html+=line;
  }
  if(p.g3b){
    let line=p.g3b;
    if(p.g3b_num1)line+=` <span class="num">${p.g3b_num1}</span>`;
    if(p.g3b_num2)line+=` ${p.g3b_num2}`;
    html+='<br>'+line;
  }
  return html;
}

/* ── 字幕初始化：空白，等待逐字出現 ── */
function showSub(text){
  subFull=text; subIdx=0; subPlaying=false;
  clearInterval(subTimer);
  document.getElementById('subPlayBtn').textContent='▶ 播放';
  const el=document.getElementById('subText');
  el.innerHTML='<span class="sub-cursor" id="subCursor"></span>';
  stopSpeak();
  // 更新快取狀態UI
  if(typeof updateCacheUI === 'function') updateCacheUI(curAudioId);
}

/* ── ▶播放：逐字出現（暗→亮） ── */
function toggleSub(){
  if(subPlaying){
    clearInterval(subTimer); subPlaying=false;
    document.getElementById('subPlayBtn').textContent='▶ 繼續';
    setWave(false);
  } else {
    subPlaying=true;
    document.getElementById('subPlayBtn').textContent='⏸ 暫停';
    setWave(true);

    // 若從頭開始，清空重來
    if(subIdx===0){
      document.getElementById('subText').innerHTML='<span class="sub-cursor" id="subCursor"></span>';
    }

    subTimer=setInterval(()=>{
      if(subIdx<subFull.length){
        const cursor=document.getElementById('subCursor');
        const span=document.createElement('span');
        span.className='sub-char lit';
        span.textContent=subFull[subIdx];
        if(cursor) cursor.before(span);
        subIdx++;
      } else {
        clearInterval(subTimer); subPlaying=false;
        document.getElementById('subPlayBtn').textContent='↺ 重播';
        const cursor=document.getElementById('subCursor');
        if(cursor) cursor.style.display='none';
        setWave(false);
        subIdx=0;
      }
    }, 110);
  }
}

/* ── 音波動畫 ── */
function setWave(on){
  const wb=document.getElementById('waveBars');
  const mic=document.getElementById('subIcon');
  if(on){ wb.classList.add('active'); mic.classList.add('speaking'); }
  else  { wb.classList.remove('active'); mic.classList.remove('speaking'); }
}

/* ── 🔊朗讀：ElevenLabs API ＋ 快取 ＋ 下載 ── */
const EL_API_KEY = 'sk_be45acb62f40b8917a21bce31a921b2a352815ca3cfae3d5';
const EL_VOICE_ID = 'auoHciLZJwKTwYUoRTYz'; // Rex大叔克隆聲音
const EL_MODEL = 'eleven_multilingual_v2';

// 快取：key = 頁面id，value = { blob, url }
const audioCache = new Map();

let speaking=false, elAudio=null, charTimer=null;
let curAudioId = ''; // 目前播放的頁面id，供下載用

function stopSpeak(){
  if(elAudio){ elAudio.pause(); elAudio=null; }
  clearInterval(charTimer); charTimer=null;
  speaking=false;
  const btn=document.getElementById('subSpeakBtn');
  if(btn){ btn.textContent='🔊'; btn.classList.remove('speaking'); }
  setWave(false);
}

function updateCacheUI(pageId){
  const hasCached = audioCache.has(pageId);
  // 綠點：有快取就顯示
  const dot = document.getElementById('cacheDot');
  if(dot) dot.style.display = hasCached ? 'block' : 'none';
  // 下載按鈕：有快取才顯示
  const dlBtn = document.getElementById('subDlBtn');
  if(dlBtn) dlBtn.style.display = hasCached ? 'block' : 'none';
  // 🔊按鈕邊框變綠：表示已有快取不會再消耗額度
  const speakBtn = document.getElementById('subSpeakBtn');
  if(speakBtn){
    if(hasCached) speakBtn.classList.add('cached');
    else speakBtn.classList.remove('cached');
  }
}

function downloadAudio(){
  const cache = audioCache.get(curAudioId);
  if(!cache) return;
  const a = document.createElement('a');
  a.href = cache.url;
  a.download = `168投資小百科_${curAudioId}.mp3`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

async function toggleSpeak(){
  const btn=document.getElementById('subSpeakBtn');
  if(speaking){ stopSpeak(); return; }

  clearInterval(subTimer); subPlaying=false;
  document.getElementById('subPlayBtn').textContent='▶ 播放';

  const el=document.getElementById('subText');
  el.innerHTML='<span class="sub-cursor" id="subCursor"></span>';
  let charIdx=0;

  // 取得當前頁面id
  const pageId = curAudioId;

  // 檢查快取
  let audioUrl = '';
  let audioDuration = 0;

  if(audioCache.has(pageId)){
    // 有快取，直接用，不消耗額度
    audioUrl = audioCache.get(pageId).url;
    btn.textContent='⏳';
    btn.classList.add('speaking');
  } else {
    // 沒快取，呼叫API
    btn.textContent='⏳';
    btn.classList.add('speaking');

    try{
      const res=await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${EL_VOICE_ID}`,{
        method:'POST',
        headers:{ 'xi-api-key': EL_API_KEY, 'Content-Type':'application/json' },
        body:JSON.stringify({
          text: subFull,
          model_id: EL_MODEL,
          voice_settings:{ stability:0.45, similarity_boost:0.80, style:0.3, speed:0.95 }
        })
      });
      if(!res.ok) throw new Error('API錯誤 '+res.status);

      const blob = await res.blob();
      audioUrl = URL.createObjectURL(blob);

      // 存入快取
      audioCache.set(pageId, { blob, url: audioUrl });
      updateCacheUI(pageId);

    } catch(e){
      stopSpeak();
      alert('朗讀失敗：'+e.message);
      return;
    }
  }

  elAudio = new Audio(audioUrl);

  elAudio.onloadedmetadata=()=>{
    const duration = elAudio.duration;
    const totalChars = subFull.length;
    const msPerChar = (duration * 1000) / totalChars * 0.98;

    elAudio.onplay=()=>{
      speaking=true;
      btn.textContent='⏹';
      setWave(true);
      charIdx=0;
      clearInterval(charTimer);
      charTimer=setInterval(()=>{
        if(charIdx < totalChars){
          const cursor=document.getElementById('subCursor');
          const span=document.createElement('span');
          span.className='sub-char lit';
          span.textContent=subFull[charIdx];
          if(cursor) cursor.before(span);
          charIdx++;
        } else {
          clearInterval(charTimer);
          const cursor=document.getElementById('subCursor');
          if(cursor) cursor.style.display='none';
        }
      }, msPerChar);
    };

    elAudio.onended=()=>{
      clearInterval(charTimer);
      const cursor=document.getElementById('subCursor');
      while(charIdx<totalChars){
        const span=document.createElement('span');
        span.className='sub-char lit';
        span.textContent=subFull[charIdx++];
        if(cursor) cursor.before(span);
      }
      if(cursor) cursor.style.display='none';
      stopSpeak();
    };
    elAudio.onerror=()=>{ stopSpeak(); };
    elAudio.play();
  };
  elAudio.onerror=()=>{ stopSpeak(); alert('音訊載入失敗'); };
}
